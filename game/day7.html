<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Dash — Day 7</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="view" width="1080" height="1920"></canvas>
<script>
'use strict';
/*
 * Neon Dash, day 7: a week of updates on top of the day-1 build.
 * The course itself never changed — same seed, same 26 blocks, same
 * scripted jumps — what changed is everything around it: a night sky
 * with parallax towers, a coin line worth chasing, landing sparks, a
 * glowing runner and a real HUD.
 *
 * Like day 1, every frame is a pure function of the offset passed to
 * window.renderAt(ms). No wall clock, no Math.random at draw time;
 * even the particles are derived from the jump schedule, so any frame
 * can be reproduced exactly.
 */

// ---------- shared world model (unchanged since day 1) ----------
var VIEW_W = 1080, VIEW_H = 1920;
var GROUND_Y = 1560;              // y of the track surface
var RUN_SPEED = 520;              // pixels per second
var HERO_X = 300, HERO_W = 64, HERO_H = 92;

// Small deterministic PRNG (mulberry32) so the course is built once,
// identically, on every load.
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var dice = mulberry32(1337);

// The course: 26 blocks. Positions and sizes come from the seeded dice.
var blocks = [];
(function buildCourse() {
  var cursor = 1500;
  for (var i = 0; i < 26; i++) {
    blocks.push({
      x: cursor,
      w: 46 + Math.floor(dice() * 26),
      h: 44 + Math.floor(dice() * 66)
    });
    cursor += 400 + Math.floor(dice() * 240);
  }
})();

// Coin line: laid out from the same dice stream, right after the blocks.
var coinLine = [];
for (var ci = 0; ci < 34; ci++) {
  coinLine.push({
    x: 900 + ci * 185 + Math.floor(dice() * 70),
    y: GROUND_Y - 150 - Math.floor(dice() * 160)
  });
}

// Scripted jumps: the runner leaves the ground a fixed lead distance
// before each block, so the same run clears the same blocks every time.
var JUMP_MS = 640, JUMP_TOP = 250, JUMP_LEAD = 170;
var jumpStarts = blocks.map(function (b) {
  return (b.x - HERO_X - HERO_W - JUMP_LEAD) / RUN_SPEED * 1000;
});

function jumpHeightAt(t) {
  for (var i = 0; i < jumpStarts.length; i++) {
    var p = (t - jumpStarts[i]) / JUMP_MS;
    if (p >= 0 && p <= 1) {
      var q = 2 * p - 1;
      return JUMP_TOP * (1 - q * q);
    }
  }
  return 0;
}

function scrolledAt(t) { return RUN_SPEED * t / 1000; }

// A coin counts as collected once its crossing moment has passed while
// the runner's body overlapped the coin's height.
function coinCollected(coin, t) {
  var crossing = (coin.x - HERO_X - HERO_W / 2) / RUN_SPEED * 1000;
  if (t < crossing) return false;
  var feet = GROUND_Y - jumpHeightAt(crossing);
  return coin.y > feet - HERO_H - 34 && coin.y < feet + 34;
}

// ---------- day 7 dressing, also generated from the dice ----------
var starField = [];
for (var si = 0; si < 90; si++) {
  starField.push({
    x: Math.floor(dice() * VIEW_W),
    y: Math.floor(dice() * 900),
    r: 1 + dice() * 2
  });
}

function makeSkyline(count, hMin, hMax) {
  var towers = [], x = 0;
  for (var i = 0; i < count; i++) {
    var w = 90 + Math.floor(dice() * 130);
    towers.push({ x: x, w: w, h: hMin + Math.floor(dice() * (hMax - hMin)) });
    x += w + 8 + Math.floor(dice() * 30);
  }
  return { towers: towers, span: x };
}
var farSkyline = makeSkyline(26, 240, 520);
var nearSkyline = makeSkyline(26, 380, 760);

// Cheap stable hash for window lights and particle spreads.
function hash01(n) {
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ---------- rendering ----------
var ctx = document.getElementById('view').getContext('2d');

function paintSkyline(sky, offset, colour, litWindows) {
  var shift = -(offset % sky.span);
  var rep, i, b, sx;
  ctx.fillStyle = colour;
  for (rep = 0; rep < 3; rep++) {
    for (i = 0; i < sky.towers.length; i++) {
      b = sky.towers[i];
      sx = b.x + shift + rep * sky.span;
      if (sx > VIEW_W || sx + b.w < 0) continue;
      ctx.fillRect(sx, GROUND_Y - b.h, b.w, b.h);
      if (!litWindows) continue;
      for (var r = 0; r < Math.floor(b.h / 64); r++) {
        for (var c = 0; c < Math.floor(b.w / 34); c++) {
          if (hash01(b.x * 3 + r * 17 + c * 7) <= 0.55) continue;
          ctx.fillStyle = 'rgba(250, 204, 21, 0.55)';
          ctx.fillRect(sx + 10 + c * 34, GROUND_Y - b.h + 14 + r * 64, 11, 15);
          ctx.fillStyle = colour;
        }
      }
    }
  }
}

function paintLandingSparks(t) {
  for (var i = 0; i < jumpStarts.length; i++) {
    var age = t - (jumpStarts[i] + JUMP_MS);
    if (age < 0 || age > 380) continue;
    var secs = age / 1000;
    for (var k = 0; k < 12; k++) {
      var vx = (hash01(i * 31 + k * 7) - 0.5) * 380;
      var vy = -(110 + hash01(i * 17 + k * 13) * 190);
      var px = HERO_X + HERO_W / 2 + vx * secs;
      var py = GROUND_Y + vy * secs + 460 * secs * secs;
      ctx.globalAlpha = 1 - age / 380;
      ctx.fillStyle = k % 2 ? '#67e8f9' : '#f0abfc';
      ctx.fillRect(px - 4, py - 4, 8, 8);
    }
  }
  ctx.globalAlpha = 1;
}

function drawFrame(t) {
  var scrolled = scrolledAt(t);
  var i, sx;

  // night sky
  var skyGrad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  skyGrad.addColorStop(0, '#070b26');
  skyGrad.addColorStop(0.6, '#131038');
  skyGrad.addColorStop(1, '#1d0f33');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // twinkling stars (twinkle phase is a function of t, not of a clock)
  ctx.fillStyle = '#cfe6ff';
  for (i = 0; i < starField.length; i++) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t / 700 + i * 1.7));
    ctx.fillRect(starField[i].x, starField[i].y, starField[i].r, starField[i].r);
  }
  ctx.globalAlpha = 1;

  // moon with a soft halo
  ctx.save();
  ctx.shadowColor = '#a5b4fc';
  ctx.shadowBlur = 60;
  ctx.fillStyle = '#e8ecff';
  ctx.beginPath();
  ctx.arc(880, 250, 62, 0, 7);
  ctx.fill();
  ctx.restore();

  // two skyline layers drifting slower than the run
  paintSkyline(farSkyline, scrolled * 0.25, '#141d47', false);
  paintSkyline(nearSkyline, scrolled * 0.5, '#0a1130', true);

  // ground slab and its scrolling grid
  ctx.fillStyle = '#070714';
  ctx.fillRect(0, GROUND_Y, VIEW_W, VIEW_H - GROUND_Y);
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.20)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  var tick = -(scrolled % 120);
  for (i = 0; i <= VIEW_W / 120 + 1; i++) {
    ctx.moveTo(tick + i * 120, GROUND_Y + 46);
    ctx.lineTo(tick + i * 120 - 30, VIEW_H);
  }
  ctx.moveTo(0, GROUND_Y + 120); ctx.lineTo(VIEW_W, GROUND_Y + 120);
  ctx.moveTo(0, GROUND_Y + 250); ctx.lineTo(VIEW_W, GROUND_Y + 250);
  ctx.stroke();

  // the neon edge the runner actually lands on
  ctx.save();
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#67e8f9';
  ctx.fillRect(0, GROUND_Y - 4, VIEW_W, 5);
  ctx.restore();

  // coins still on the line, bobbing gently
  for (i = 0; i < coinLine.length; i++) {
    if (coinCollected(coinLine[i], t)) continue;
    sx = coinLine[i].x - scrolled;
    if (sx < -60 || sx > VIEW_W + 60) continue;
    var bob = Math.sin(t / 280 + coinLine[i].x) * 6;
    ctx.save();
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffd94d';
    ctx.beginPath();
    ctx.arc(sx, coinLine[i].y + bob, 16, 0, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath();
    ctx.arc(sx, coinLine[i].y + bob, 8, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  // blocks, restyled as neon hazards — cyan and magenta in turn
  for (i = 0; i < blocks.length; i++) {
    sx = blocks[i].x - scrolled;
    if (sx < -120 || sx > VIEW_W + 120) continue;
    var neon = i % 2 ? '#e879f9' : '#22d3ee';
    var blockGrad = ctx.createLinearGradient(0, GROUND_Y - blocks[i].h, 0, GROUND_Y);
    blockGrad.addColorStop(0, '#221243');
    blockGrad.addColorStop(1, '#0d0721');
    ctx.save();
    ctx.shadowColor = neon;
    ctx.shadowBlur = 16;
    ctx.fillStyle = blockGrad;
    ctx.fillRect(sx, GROUND_Y - blocks[i].h, blocks[i].w, blocks[i].h);
    ctx.strokeStyle = neon;
    ctx.lineWidth = 3;
    ctx.strokeRect(sx, GROUND_Y - blocks[i].h, blocks[i].w, blocks[i].h);
    ctx.restore();
  }

  paintLandingSparks(t);

  // motion ghosts behind the runner
  var heroHeight = jumpHeightAt(t);
  var heroTop = GROUND_Y - heroHeight - HERO_H;
  for (i = 3; i >= 1; i--) {
    ctx.globalAlpha = 0.10 * (4 - i);
    ctx.fillStyle = '#d946ef';
    ctx.fillRect(HERO_X - i * 30, heroTop + i * 3, HERO_W, HERO_H);
  }
  ctx.globalAlpha = 1;

  // the runner: gradient body, glowing outline, visor, working legs
  ctx.save();
  ctx.shadowColor = '#e879f9';
  ctx.shadowBlur = 26;
  var bodyGrad = ctx.createLinearGradient(0, heroTop, 0, heroTop + HERO_H);
  bodyGrad.addColorStop(0, '#ff4ecd');
  bodyGrad.addColorStop(1, '#7c3aed');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.roundRect(HERO_X, heroTop, HERO_W, HERO_H, 14);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#a5f3fc';
  ctx.beginPath();
  ctx.roundRect(HERO_X + 30, heroTop + 18, 26, 12, 6);
  ctx.fill();
  ctx.fillStyle = '#2e1065';
  var airborne = heroHeight > 4;
  var step = Math.floor(t / 90) % 2;
  var legA = airborne ? 16 : (step ? 26 : 12);
  var legB = airborne ? 16 : (step ? 12 : 26);
  ctx.fillRect(HERO_X + 9, heroTop + HERO_H - legA, 14, legA);
  ctx.fillRect(HERO_X + HERO_W - 23, heroTop + HERO_H - legB, 14, legB);

  // HUD: score and distance up top, coin tally under the score
  var taken = 0;
  for (i = 0; i < coinLine.length; i++) if (coinCollected(coinLine[i], t)) taken++;
  var score = Math.floor(scrolled / 8) + taken * 25;
  ctx.font = '700 46px "JetBrains Mono", monospace';
  ctx.fillStyle = '#e0f2fe';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + String(score).padStart(6, '0'), 36, 84);
  ctx.textAlign = 'right';
  ctx.fillText(Math.floor(scrolled / 50) + ' m', VIEW_W - 36, 84);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd94d';
  ctx.beginPath();
  ctx.arc(54, 140, 14, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#fef9c3';
  ctx.fillText('x ' + taken, 82, 156);

  // thin progress bar under the HUD: share of the course already run
  var courseEnd = blocks[blocks.length - 1].x + 600;
  ctx.fillStyle = 'rgba(224, 242, 254, 0.18)';
  ctx.fillRect(36, 196, VIEW_W - 72, 8);
  ctx.fillStyle = '#22d3ee';
  ctx.fillRect(36, 196, (VIEW_W - 72) * Math.min(1, scrolled / courseEnd), 8);
}

window.renderAt = function (ms) { drawFrame(Math.max(0, ms)); };
window.renderAt(0);
</script>
</body>
</html>
