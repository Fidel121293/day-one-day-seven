<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Dash — Day 7 build</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0221; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<script>
'use strict';
// NEON DASH — day 7 build.
// Same track, same seed, same autopilot inputs as the day 1 build (the world
// generation and jump physics below are identical), with a week of daily
// updates on top: gradient sunset sky, parallax city, neon grid ground,
// glow + trail on the player, coins with particle bursts, landing dust,
// screen shake and a proper HUD. Still a pure function of elapsed time.

var W = 1080, H = 1920;
var GROUND_Y = 1560;          // top edge of the ground
var PLAYER_X = 250, PLAYER = 92;
var SPEED = 640;              // px per second, world scroll
var JUMP_D = 0.66, JUMP_H = 300;

function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- world generation (shared verbatim with the day 1 build) ----
var obstacles = [];
var jumpTimes = [];
(function buildWorld() {
  var rng = mulberry32(1337);
  var x = 1500;
  for (var i = 0; i < 26; i++) {
    var h = 96 + rng() * 70;
    obstacles.push({ x: x, w: 84, h: h });
    jumpTimes.push((x - (PLAYER_X + PLAYER + 300)) / SPEED);
    x += 760 + rng() * 420;
  }
})();

function jumpOffset(t) {
  for (var i = 0; i < jumpTimes.length; i++) {
    var s = (t - jumpTimes[i]) / JUMP_D;
    if (s >= 0 && s <= 1) return 4 * JUMP_H * s * (1 - s);
  }
  return 0;
}

// ---- day 7 additions: coins, collect events, city layers ----
var coins = [];
var collectTimes = [];
(function buildCoins() {
  for (var i = 0; i < obstacles.length - 1; i++) {
    var cx = obstacles[i].x + 430;               // mid-gap, on the jump arc
    coins.push({ x: cx, y: GROUND_Y - 300 });
    collectTimes.push((cx - (PLAYER_X + PLAYER / 2)) / SPEED);
  }
})();

function makeCity(seed, count, minH, maxH) {
  var rng = mulberry32(seed);
  var layer = [], x = 0;
  for (var i = 0; i < count; i++) {
    var w = 120 + rng() * 150, h = minH + rng() * (maxH - minH);
    layer.push({ x: x, w: w, h: h, seed: rng() * 1000 });
    x += w + 14;
  }
  return { buildings: layer, span: x };
}
var cityFar = makeCity(77, 14, 260, 620);
var cityNear = makeCity(99, 12, 380, 880);

var ctx = document.getElementById('game').getContext('2d');

function drawCity(layer, par, color, t) {
  var off = (SPEED * t * par) % layer.span;
  ctx.fillStyle = color;
  for (var k = -1; k < 2; k++) {
    for (var i = 0; i < layer.buildings.length; i++) {
      var b = layer.buildings[i];
      var bx = b.x - off + k * layer.span;
      if (bx + b.w < 0 || bx > W) continue;
      ctx.fillRect(bx, GROUND_Y - b.h, b.w, b.h);
    }
  }
}

function drawWindows(layer, par, t) {
  var off = (SPEED * t * par) % layer.span;
  for (var k = -1; k < 2; k++) {
    for (var i = 0; i < layer.buildings.length; i++) {
      var b = layer.buildings[i];
      var bx = b.x - off + k * layer.span;
      if (bx + b.w < 0 || bx > W) continue;
      for (var r = 0; r < 5; r++) {
        for (var c = 0; c < 3; c++) {
          var hsh = Math.sin(b.seed + r * 37.7 + c * 91.3) * 43758.5453;
          if (hsh - Math.floor(hsh) < 0.42) continue;   // most windows dark
          ctx.fillStyle = 'rgba(255, 214, 130, 0.85)';
          ctx.fillRect(bx + 18 + c * 34, GROUND_Y - b.h + 26 + r * 52, 14, 20);
        }
      }
    }
  }
}

function renderAt(ms) {
  var t = ms / 1000;

  // screen shake, decaying after each landing
  var shX = 0, shY = 0;
  for (var li = 0; li < jumpTimes.length; li++) {
    var dtl = t - (jumpTimes[li] + JUMP_D);
    if (dtl > 0 && dtl < 0.3) {
      var amp = 7 * Math.exp(-dtl * 10);
      shX = amp * Math.sin(dtl * 70);
      shY = amp * Math.cos(dtl * 58) * 0.6;
    }
  }
  ctx.save();
  ctx.translate(shX, shY);

  // sunset gradient sky
  var sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#0d0221');
  sky.addColorStop(0.55, '#3b0f54');
  sky.addColorStop(0.85, '#b83280');
  sky.addColorStop(1, '#ff7e5f');
  ctx.fillStyle = sky;
  ctx.fillRect(-20, -20, W + 40, GROUND_Y + 20);

  // sun disc with scanline cuts
  ctx.fillStyle = '#ffd319';
  ctx.beginPath();
  ctx.arc(790, GROUND_Y - 430, 190, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#b83280';
  for (var s2 = 0; s2 < 4; s2++) {
    ctx.fillRect(580, GROUND_Y - 430 + 30 + s2 * 42, 420, 7 + s2 * 3);
  }

  // parallax city
  drawCity(cityFar, 0.22, '#1b1035', t);
  drawCity(cityNear, 0.45, '#241447', t);
  drawWindows(cityNear, 0.45, t);

  // ground: dark slab, neon edge, scrolling grid
  ctx.fillStyle = '#120826';
  ctx.fillRect(-20, GROUND_Y, W + 40, H - GROUND_Y + 20);
  ctx.fillStyle = '#00f5d4';
  ctx.fillRect(-20, GROUND_Y, W + 40, 5);
  ctx.strokeStyle = 'rgba(0, 245, 212, 0.28)';
  ctx.lineWidth = 3;
  var gridOff = (SPEED * t) % 120;
  for (var gx = -gridOff; gx < W; gx += 120) {
    ctx.beginPath();
    ctx.moveTo(gx, GROUND_Y + 8);
    ctx.lineTo(gx - 60, H);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(155, 93, 229, 0.35)';
  for (var gy = GROUND_Y + 90; gy < H; gy += 90) {
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }

  // obstacles: dark slabs with a magenta neon rim
  for (var i = 0; i < obstacles.length; i++) {
    var ox = obstacles[i].x - SPEED * t;
    if (ox < -140 || ox > W + 140) continue;
    ctx.fillStyle = '#1d1038';
    ctx.fillRect(ox, GROUND_Y - obstacles[i].h, obstacles[i].w, obstacles[i].h);
    ctx.strokeStyle = '#f72585';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#f72585';
    ctx.shadowBlur = 18;
    ctx.strokeRect(ox, GROUND_Y - obstacles[i].h, obstacles[i].w, obstacles[i].h);
    ctx.shadowBlur = 0;
  }

  // coins: spinning gold discs; collected ones burst and vanish
  var collected = 0;
  for (var ci = 0; ci < coins.length; ci++) {
    var ct = collectTimes[ci];
    var cxp = coins[ci].x - SPEED * t;
    if (t >= ct) {
      collected++;
      var dtc = t - ct;
      if (dtc < 0.5 && cxp > -80 && cxp < W + 80) {
        for (var p = 0; p < 10; p++) {
          var ang = (p / 10) * Math.PI * 2 + ci;
          var dist = dtc * 260;
          var px = coins[ci].x - SPEED * ct + Math.cos(ang) * dist;
          var py2 = coins[ci].y + Math.sin(ang) * dist + dtc * dtc * 300;
          ctx.fillStyle = 'rgba(255, 209, 25, ' + (1 - dtc * 2) + ')';
          ctx.beginPath();
          ctx.arc(px, py2, 7 * (1 - dtc), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      continue;
    }
    if (cxp < -60 || cxp > W + 60) continue;
    var squish = Math.abs(Math.cos(t * 5 + ci));
    ctx.fillStyle = '#ffd319';
    ctx.shadowColor = '#ffd319';
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.ellipse(cxp, coins[ci].y, 26 * squish + 4, 30, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // landing dust
  for (var di = 0; di < jumpTimes.length; di++) {
    var dtd = t - (jumpTimes[di] + JUMP_D);
    if (dtd > 0 && dtd < 0.35) {
      ctx.fillStyle = 'rgba(0, 245, 212, ' + (0.5 * (1 - dtd / 0.35)) + ')';
      for (var dp = -1; dp <= 1; dp += 2) {
        ctx.beginPath();
        ctx.arc(PLAYER_X + PLAYER / 2 + dp * (40 + dtd * 260), GROUND_Y - 8, 12 + dtd * 30, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // player trail (ghost squares at earlier times)
  for (var g = 6; g >= 1; g--) {
    var gt = t - g * 0.028;
    if (gt < 0) continue;
    var gy2 = GROUND_Y - PLAYER - jumpOffset(gt);
    ctx.fillStyle = 'rgba(0, 245, 212, ' + (0.05 + (6 - g) * 0.02) + ')';
    ctx.fillRect(PLAYER_X - g * 7, gy2, PLAYER, PLAYER);
  }

  // player: glowing neon square with a bright core
  var py = GROUND_Y - PLAYER - jumpOffset(t);
  ctx.shadowColor = '#00f5d4';
  ctx.shadowBlur = 34;
  ctx.fillStyle = '#00f5d4';
  ctx.fillRect(PLAYER_X, py, PLAYER, PLAYER);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#eafffb';
  ctx.fillRect(PLAYER_X + 22, py + 22, PLAYER - 44, PLAYER - 44);

  ctx.restore();

  // HUD: score pill + coin counter
  var score = Math.floor(t * 12) + collected * 50;
  ctx.fillStyle = 'rgba(13, 2, 33, 0.72)';
  ctx.beginPath();
  ctx.roundRect(36, 44, 430, 104, 52);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0, 245, 212, 0.8)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 54px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 72, 116);
  ctx.fillStyle = '#ffd319';
  ctx.beginPath();
  ctx.arc(540, 96, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillText('× ' + collected, 590, 116);
}

window.renderAt = renderAt;
renderAt(0);

// free-run mode for opening the file by hand: ?play=1
if (location.search.indexOf('play=1') >= 0) {
  var t0 = performance.now();
  (function loop() {
    renderAt(performance.now() - t0);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
