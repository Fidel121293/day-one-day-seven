<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Dash — Day 1 build</title>
<style>
  html, body { margin: 0; padding: 0; background: #888; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<script>
'use strict';
// NEON DASH — day 1 build.
// One-button endless runner, autopilot demo. Everything on screen is a pure
// function of elapsed time (renderAt), so a capture script can step it
// frame by frame and always get the same picture.

var W = 1080, H = 1920;
var GROUND_Y = 1560;          // top edge of the ground
var PLAYER_X = 250, PLAYER = 92;
var SPEED = 640;              // px per second, world scroll
var JUMP_D = 0.66, JUMP_H = 300;

function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- world generation (shared verbatim with the day 7 build) ----
var obstacles = [];
var jumpTimes = [];
(function buildWorld() {
  var rng = mulberry32(1337);
  var x = 1500;
  for (var i = 0; i < 26; i++) {
    var h = 96 + rng() * 70;
    obstacles.push({ x: x, w: 84, h: h });
    jumpTimes.push((x - (PLAYER_X + PLAYER + 300)) / SPEED);
    x += 760 + rng() * 420;
  }
})();

function jumpOffset(t) {
  for (var i = 0; i < jumpTimes.length; i++) {
    var s = (t - jumpTimes[i]) / JUMP_D;
    if (s >= 0 && s <= 1) return 4 * JUMP_H * s * (1 - s);
  }
  return 0;
}

var ctx = document.getElementById('game').getContext('2d');

function renderAt(ms) {
  var t = ms / 1000;
  // flat grey sky
  ctx.fillStyle = '#9a9a9a';
  ctx.fillRect(0, 0, W, H);
  // ground
  ctx.fillStyle = '#6f6f6f';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(0, GROUND_Y, W, 6);
  // obstacles: plain dark boxes
  ctx.fillStyle = '#4d4d4d';
  for (var i = 0; i < obstacles.length; i++) {
    var ox = obstacles[i].x - SPEED * t;
    if (ox < -120 || ox > W + 120) continue;
    ctx.fillRect(ox, GROUND_Y - obstacles[i].h, obstacles[i].w, obstacles[i].h);
  }
  // player: plain light box
  var py = GROUND_Y - PLAYER - jumpOffset(t);
  ctx.fillStyle = '#d9d9d9';
  ctx.fillRect(PLAYER_X, py, PLAYER, PLAYER);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 4;
  ctx.strokeRect(PLAYER_X, py, PLAYER, PLAYER);
  // score, plain text
  ctx.fillStyle = '#ffffff';
  ctx.font = '48px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + Math.floor(t * 12), 40, 90);
}

window.renderAt = renderAt;
renderAt(0);

// free-run mode for opening the file by hand: ?play=1
if (location.search.indexOf('play=1') >= 0) {
  var t0 = performance.now();
  (function loop() {
    renderAt(performance.now() - t0);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
