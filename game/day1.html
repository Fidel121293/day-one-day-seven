<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Dash — Day 1 prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="view" width="1080" height="1920"></canvas>
<script>
'use strict';
/*
 * Neon Dash, day 1: the first working build. One button, endless track,
 * grey boxes on grey sky. The world below (seed, obstacles, jump timing)
 * is the exact same world the day-7 build runs in — only the paint job
 * and the extras differ.
 *
 * Everything is a pure function of the time offset handed to
 * window.renderAt(ms): no wall clock, no Math.random, so a frame can be
 * re-rendered identically at any moment.
 */

// ---------- shared world model ----------
var VIEW_W = 1080, VIEW_H = 1920;
var GROUND_Y = 1560;              // y of the track surface
var RUN_SPEED = 520;              // pixels per second
var HERO_X = 300, HERO_W = 64, HERO_H = 92;

// Small deterministic PRNG (mulberry32) so the course is built once,
// identically, on every load.
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var dice = mulberry32(1337);

// The course: 26 blocks. Positions and sizes come from the seeded dice.
var blocks = [];
(function buildCourse() {
  var cursor = 1500;
  for (var i = 0; i < 26; i++) {
    blocks.push({
      x: cursor,
      w: 46 + Math.floor(dice() * 26),
      h: 44 + Math.floor(dice() * 66)
    });
    cursor += 400 + Math.floor(dice() * 240);
  }
})();

// Coin line for the shared world. Day 1 never paints them (no coin
// system yet), but the layout is part of the course definition.
var coinLine = [];
for (var ci = 0; ci < 34; ci++) {
  coinLine.push({
    x: 900 + ci * 185 + Math.floor(dice() * 70),
    y: GROUND_Y - 150 - Math.floor(dice() * 160)
  });
}

// Scripted jumps: the runner leaves the ground a fixed lead distance
// before each block, so the same run clears the same blocks every time.
var JUMP_MS = 640, JUMP_TOP = 250, JUMP_LEAD = 170;
var jumpStarts = blocks.map(function (b) {
  return (b.x - HERO_X - HERO_W - JUMP_LEAD) / RUN_SPEED * 1000;
});

function jumpHeightAt(t) {
  for (var i = 0; i < jumpStarts.length; i++) {
    var p = (t - jumpStarts[i]) / JUMP_MS;
    if (p >= 0 && p <= 1) {
      var q = 2 * p - 1;
      return JUMP_TOP * (1 - q * q);
    }
  }
  return 0;
}

function scrolledAt(t) { return RUN_SPEED * t / 1000; }

// ---------- day 1 rendering: flat and grey ----------
var ctx = document.getElementById('view').getContext('2d');

function drawFrame(t) {
  var scrolled = scrolledAt(t);
  var i, sx;

  // sky
  ctx.fillStyle = '#8f8f8f';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // one flat circle pretending to be a sun
  ctx.fillStyle = '#d8d8d8';
  ctx.beginPath();
  ctx.arc(880, 250, 90, 0, 7);
  ctx.fill();

  // ground slab with a lighter edge line
  ctx.fillStyle = '#737373';
  ctx.fillRect(0, GROUND_Y, VIEW_W, VIEW_H - GROUND_Y);
  ctx.fillStyle = '#a6a6a6';
  ctx.fillRect(0, GROUND_Y, VIEW_W, 8);

  // blocks: plain dark rectangles
  ctx.fillStyle = '#454545';
  for (i = 0; i < blocks.length; i++) {
    sx = blocks[i].x - scrolled;
    if (sx < -120 || sx > VIEW_W + 120) continue;
    ctx.fillRect(sx, GROUND_Y - blocks[i].h, blocks[i].w, blocks[i].h);
  }

  // the runner: one dark box with a cap strip. That is the whole sprite.
  var heroTop = GROUND_Y - jumpHeightAt(t) - HERO_H;
  ctx.fillStyle = '#26262b';
  ctx.fillRect(HERO_X, heroTop, HERO_W, HERO_H);
  ctx.fillStyle = '#3d3d44';
  ctx.fillRect(HERO_X, heroTop, HERO_W, 14);

  // legs: darker stubs inside the box, swapping length on a step
  // timer (frozen mid-jump) — the fanciest animation day 1 could afford
  var air = jumpHeightAt(t) > 4;
  var step = Math.floor(t / 110) % 2;
  var legA = air ? 15 : (step ? 25 : 12);
  var legB = air ? 15 : (step ? 12 : 25);
  ctx.fillStyle = '#17171b';
  ctx.fillRect(HERO_X + 8, heroTop + HERO_H - legA, 13, legA);
  ctx.fillRect(HERO_X + HERO_W - 21, heroTop + HERO_H - legB, 13, legB);
}

window.renderAt = function (ms) { drawFrame(Math.max(0, ms)); };
window.renderAt(0);
</script>
</body>
</html>
